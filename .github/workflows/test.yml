name: Test and Deploy

on:
  push:

permissions:
  contents: write
  pull-requests: write

env:
  TZ: Europe/London

jobs:
  build:
    name: Run Tests and Generate Reports
    environment: test
    runs-on: ubuntu-latest
    env:
      # Database Configuration
      DATABASE_HOSTNAME: ${{ vars.DATABASE_HOSTNAME }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}

      # Authentication
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}

      # Application Settings
      MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
      LOG_DIRECTORY: ${{ vars.LOG_DIRECTORY }}
      TEST_MODE: ${{ vars.TEST_MODE }}
      MIN_PASSWORD_LENGTH: ${{ vars.MIN_PASSWORD_LENGTH }}
      APP_DEMO_USERNAME: ${{ vars.APP_DEMO_USERNAME }}
      APP_DEMO_PASSWORD: ${{ vars.APP_DEMO_PASSWORD }}
      MONTHLY_SCRAPE_QUOTA: ${{ vars.MONTHLY_SCRAPE_QUOTA }}

      # Email Configuration
      MAIN_EMAIL_USERNAME: ${{ secrets.MAIN_EMAIL_USERNAME }}
      MAIN_EMAIL_PASSWORD: ${{ secrets.MAIN_EMAIL_PASSWORD }}
      SCRAPER_EMAIL_USERNAME: ${{ secrets.SCRAPER_EMAIL_USERNAME }}
      SCRAPER_EMAIL_PASSWORD: ${{ secrets.SCRAPER_EMAIL_PASSWORD }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_IMAP_PORT: ${{ secrets.EMAIL_IMAP_PORT }}
      EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
      SCRAPER_EMAIL: ${{ secrets.SCRAPER_EMAIL }}
      INFO_EMAIL: ${{ secrets.INFO_EMAIL }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}

      # URLs
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}

      # Verification Settings
      VERIFICATION_TOKEN_EXPIRATION_MINUTES: ${{ vars.VERIFICATION_TOKEN_EXPIRATION_MINUTES }}
      VERIFICATION_EMAIL_MIN_INTERVAL_SECONDS: ${{ vars.VERIFICATION_EMAIL_MIN_INTERVAL_SECONDS }}
      EMAIL_CHANGE_TOKEN_EXPIRATION_MINUTES: ${{ vars.EMAIL_CHANGE_TOKEN_EXPIRATION_MINUTES }}
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: ${{ vars.PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES }}

      # External API Keys
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_LINKEDIN_DATASET_ID: ${{ secrets.BRIGHTDATA_LINKEDIN_DATASET_ID }}
      BRIGHTDATA_INDEED_DATASET_ID: ${{ secrets.BRIGHTDATA_INDEED_DATASET_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}

      # Payment Configuration
      STRIPE_API_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_TOAST_PRICE_ID: ${{ secrets.STRIPE_TOAST_PRICE_ID }}

      # Frontend Config
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      REACT_APP_API_SERVICE_URL: ${{ vars.REACT_APP_SERVICE_BASE_URL }}
      REACT_APP_ENABLE_ANALYTICS: ${{ vars.REACT_APP_ENABLE_ANALYTICS }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: jam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pip and install dependencies
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./backend[dev]

      - name: Install Node.js and npm dependencies
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          cd frontend
          npm install
          cd ..

      - name: Install Stripe CLI
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          curl -s https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public | sudo gpg --dearmor -o /usr/share/keyrings/stripe.gpg
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" | sudo tee /etc/apt/sources.list.d/stripe.list
          sudo apt-get update
          sudo apt-get install -y stripe

      - name: Run backend tests
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          pytest -n auto ./backend \
            --cov=backend \
            --cov-config=backend/pyproject.toml \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --junitxml=reports/tests/backend.xml

      - name: Run frontend (Selenium) tests
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          pytest -n auto --dist loadgroup ./frontend/tests \
            --junitxml=reports/tests/frontend.xml -v

      - name: Install junitparser
        run: pip install junitparser

      - name: Merge test reports
        run: |
          junitparser merge \
            reports/tests/backend.xml \
            reports/tests/frontend.xml \
            reports/tests/tests.xml

      - name: Upload test logs and screenshots
        uses: actions/upload-artifact@v4
        if: always() && !contains(github.event.head_commit.message, '[skip tests]')
        with:
          name: test-logs-${{ github.run_number }}
          path: ${{ env.LOG_DIRECTORY }}/
          if-no-files-found: ignore
          retention-days: 14

      - name: Print log summary
        if: always() && !contains(github.event.head_commit.message, '[skip tests]')
        run: |
          echo "=== Test Log Summary ==="
          if [ -d "$LOG_DIRECTORY" ]; then
            echo "Log directory contents:"
            ls -lh "$LOG_DIRECTORY"
            echo ""
            echo "Failed test browser logs:"
            find "$LOG_DIRECTORY" -name "*FAILED*browser.log" -exec echo "  - {}" \; 2>/dev/null || echo "  None found"
            echo ""
            echo "Failed test screenshots:"
            find "$LOG_DIRECTORY" -name "*FAILED*.png" -exec echo "  - {}" \; 2>/dev/null || echo "  None found"
          else
            echo "No logs directory found (all tests may have passed)"
          fi

      - name: Generate badges and coverage
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          genbadge tests \
            --input-file=reports/tests/tests.xml \
            --output-file=reports/tests/tests-badge.svg

          genbadge coverage \
            --output-file=reports/coverage/coverage-badge.svg

      - name: Commit and push badge
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -f reports/
          git commit -m "Added reports"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PYTEST_COVERAGE_COMMENT }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/my_apps/scripts/
            ./deploy_jam.sh
