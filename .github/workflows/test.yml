name: Test and Deploy

on:
  push:

permissions:
  contents: write
  pull-requests: write

env:
  TZ: Europe/London

jobs:
  build:
    name: Run Tests and Generate Reports
    environment: test
    runs-on: ubuntu-latest
    env:
      # Database Configuration
      DATABASE_HOSTNAME: ${{ vars.DATABASE_HOSTNAME }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ vars.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}

      # Authentication
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}

      # Application Settings
      MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
      LOG_DIRECTORY: ${{ vars.LOG_DIRECTORY }}
      TEST_MODE: ${{ vars.TEST_MODE }}

      # Email Configuration
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_IMAP_PORT: ${{ secrets.EMAIL_IMAP_PORT }}
      EMAIL_IMAP_HOST: ${{ secrets.EMAIL_IMAP_HOST }}
      SCRAPER_EMAIL: ${{ secrets.SCRAPER_EMAIL }}
      INFO_EMAIL: ${{ secrets.INFO_EMAIL }}
      SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}

      # URLs
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}

      # Verification Settings
      VERIFICATION_TOKEN_EXPIRATION_MINUTES: ${{ vars.VERIFICATION_TOKEN_EXPIRATION_MINUTES }}
      VERIFICATION_EMAIL_MIN_INTERVAL_SECONDS: ${{ vars.VERIFICATION_EMAIL_MIN_INTERVAL_SECONDS }}

      # External API Keys
      BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
      BRIGHTDATA_LINKEDIN_DATASET_ID: ${{ secrets.BRIGHTDATA_LINKEDIN_DATASET_ID }}
      BRIGHTDATA_INDEED_DATASET_ID: ${{ secrets.BRIGHTDATA_INDEED_DATASET_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}

      # Payment Configuration
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_TOAST_PRICE_ID: ${{ secrets.STRIPE_TOAST_PRICE_ID }}

      # Frontend Configuration
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
      REACT_APP_MIN_PASSWORD_LENGTH: ${{ vars.REACT_APP_MIN_PASSWORD_LENGTH }}
      REACT_APP_ENABLE_ANALYTICS: ${{ vars.REACT_APP_ENABLE_ANALYTICS }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          POSTGRES_DB: jam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pip and install dependencies
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: | 
          python -m pip install --upgrade pip
          python -m pip install ./backend[dev]

      - name: Install Node.js and npm dependencies
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          cd frontend
          npm install --legacy-peer-deps
          cd ..

      - name: Run Tests with Pytest and Coverage
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
#          coverage run -m pytest -n auto ./backend -v --junitxml=reports/tests/tests.xml --html=reports/tests/report.html
          pytest -n auto ./frontend/tests/test_user_settings.py::TestPremiumSettingsPage -v

      - name: Upload test logs and screenshots
        uses: actions/upload-artifact@v4
        if: always() && !contains(github.event.head_commit.message, '[skip tests]')
        with:
          name: test-logs-${{ github.run_number }}
          path: test_logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Print log summary
        if: always() && !contains(github.event.head_commit.message, '[skip tests]')
        run: |
          echo "=== Test Log Summary ==="
          if [ -d "test_logs" ]; then
            echo "Log directory contents:"
            ls -lh test_logs/
            echo ""
            echo "Failed test browser logs:"
            find test_logs/ -name "*FAILED*browser.log" -exec echo "  - {}" \; 2>/dev/null || echo "  None found"
            echo ""
            echo "Failed test screenshots:"
            find test_logs/ -name "*FAILED*.png" -exec echo "  - {}" \; 2>/dev/null || echo "  None found"
          else
            echo "No logs directory found (all tests may have passed)"
          fi

      - name: Generate badges and coverage
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          coverage xml -o reports/coverage/coverage.xml
          genbadge tests --input-file=reports/tests/tests.xml --output-file=reports/tests/tests-badge.svg
          coverage html -d reports/coverage/htmlcov
          genbadge coverage --output-file=reports/coverage/coverage-badge.svg

      - name: Commit and push badge
        if: "!contains(github.event.head_commit.message, '[skip tests]')"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -f reports/
          git commit -m "Added reports"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PYTEST_COVERAGE_COMMENT }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/my_apps/scripts/
            ./deploy_jam.sh
