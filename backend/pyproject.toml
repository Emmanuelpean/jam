[project]
name = "jam"
version = "1.3.0"
description = "Job Application Manager"
authors = [
    { name = "Emmanuel V. Péan", email = "emmanuel.pean@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "fastapi[all]==0.138.0",
    "requests==2.34.2",
    "sqlalchemy==2.0.51",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "psycopg2-binary",
    "pydantic[email]==2.13.4",
    "PyJWT==2.13.0",
    "bcrypt==5.0.0",
    "cloudscraper==1.2.71",
    "tqdm==4.68.3",
    "gunicorn==26.0.0",
    "beautifulsoup4==4.15.0",
    "apify-client==3.0.3",
    "openai==2.43.0",
    "anthropic==0.111.0",
    "stripe==15.2.1",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "genbadge[all]==1.1.3",
    "black==26.5.1",
    "sqlalchemy-stubs==0.4",
    "psutil==7.2.2",
    "selenium==4.46.0",
    "alembic==1.18.4",
    "sqlalchemy_utils==0.42.1",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.4.0",
    "sqlalchemy2-stubs==0.0.2a38",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/emmanuelpean/jam"

[tool.coverage.run]
source = ["backend/app"]
data_file = "reports/coverage/.coverage"
omit = [
    "backend/tests/*",
    "frontend",
]

[tool.coverage.html]
directory = "reports/coverage/htmlcov"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.setuptools.packages.find]
exclude = ["reports*", "resources*"]

[tool.setuptools.package-data]
app = ["data/**/*"]

[tool.black]
line-length = 120
