[project]
name = "jam"
version = "1.3.0"
description = "Job Application Manager"
authors = [
    { name = "Emmanuel V. Péan", email = "emmanuel.pean@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "fastapi[all]==0.116.2",
    "requests==2.32.5",
    "sqlalchemy==2.0.43",
    "httpx==0.28.1",
    "pydantic-settings==2.10.1",
    "psycopg2-binary",
    "pydantic[email]==2.11.9",
    "PyJWT==2.12.1",
    "bcrypt==4.3.0",
    "cloudscraper==1.2.71",
    "tqdm==4.67.1",
    "gunicorn==23.0.0",
    "beautifulsoup4==4.14.2",
    "apify-client==2.3.0",
    "openai==2.12.0",
    "anthropic==0.84.0",
    "stripe==14.1.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pytest-html==4.1.1",
    "genbadge[all]==1.1.3",
    "black==25.9.0",
    "sqlalchemy-stubs==0.4",
    "psutil==7.1.0",
    "selenium==4.36.0",
    "alembic==1.17.2",
    "sqlalchemy_utils==0.42.1",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.3.0",
    "sqlalchemy2-stubs==0.0.2a38",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
repository = "https://github.com/emmanuelpean/jam"

[tool.coverage.run]
source = ["backend/app"]
data_file = "reports/coverage/.coverage"
omit = [
    "backend/tests/*",
    "frontend",
]

[tool.coverage.html]
directory = "reports/coverage/htmlcov"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.setuptools.packages.find]
exclude = ["reports*", "resources*"]

[tool.setuptools.package-data]
app = ["data/**/*"]

[tool.black]
line-length = 120
