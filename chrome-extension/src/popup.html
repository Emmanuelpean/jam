<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>JAM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Quicksand:wght@700&display=swap" rel="stylesheet"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            width: 300px;
            background: #fff;
            color: #2c3e50;
            user-select: none;
            border-radius: 12px;
            overflow: hidden;
        }

        /* ── Spinner ── */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        /* ── Shared button base ── */
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* ── Login view ── */
        #loginView {
            padding: 24px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .logo-icon-wrap {
            width: 52px;
            height: 52px;
        }

        .logo-icon-wrap img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .logo-name {
            font-family: "Quicksand", "Inter", sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #686de0, #4834d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 11px;
            color: #8a9bb0;
            letter-spacing: 0.3px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 12px;
            color: #5c6b78;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 9px 11px;
            border: 1.5px solid #e0e6ef;
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
            background: #f7f9fd;
            color: #2c3e50;
        }

        input:focus {
            border-color: #686de0;
            box-shadow: 0 0 0 3px rgba(104, 109, 224, 0.12);
            background: #fff;
        }

        #loginBtn {
            background: linear-gradient(135deg, #a8edea 0%, #686de0 50%, #4834d4 100%);
            color: #fff;
            margin-top: 2px;
        }

        #loginBtn:hover:not(:disabled) {
            opacity: 0.88;
        }

        #loginStatus {
            font-size: 12px;
            min-height: 15px;
            text-align: center;
        }

        #loginStatus.error {
            color: #e74c3c;
        }

        /* ── Main (logged-in) view ── */
        #mainView {
            display: flex;
            flex-direction: column;
        }

        /* Header strip */
        .main-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-bottom: 1px solid #ededed;
        }

        .header-icon-wrap {
            width: 26px;
            height: 26px;
        }

        .header-icon-wrap img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .main-logo-name {
            font-family: "Quicksand", "Inter", sans-serif;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #686de0, #4834d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .main-header-sub {
            margin-left: auto;
            font-size: 10.5px;
            color: #b0bcca;
            white-space: nowrap;
        }

        /* ── Job detection area ── */
        .job-area {
            padding: 14px 14px 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 72px;
        }

        /* Detecting state */
        .detecting-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a9bb0;
            font-size: 12.5px;
        }

        .detecting-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a8edea, #686de0);
            animation: pulse 1.1s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.85); }
            50%       { opacity: 1;    transform: scale(1.1);  }
        }

        /* No job state */
        .no-job-msg {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 6px 0 4px;
            text-align: center;
        }

        .no-job-icon {
            font-size: 24px;
            opacity: 0.22;
        }

        .no-job-text {
            font-size: 12px;
            color: #9aaabb;
            line-height: 1.5;
        }

        /* Job card */
        .job-card {
            background: #f4f6ff;
            border: 1px solid #dde2f5;
            border-radius: 10px;
            padding: 11px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 600;
            color: #fff;
            background: #0a66c2;
            border-radius: 4px;
            padding: 2px 7px 2px 5px;
            letter-spacing: 0.2px;
            width: fit-content;
        }

        .job-title {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.35;
        }

        .job-company {
            font-size: 11.5px;
            color: #5c6b78;
        }

        /* ── Action area ── */
        .action-area {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #addBtn {
            background: linear-gradient(135deg, #a8edea 0%, #686de0 50%, #4834d4 100%);
            color: #fff;
        }

        #addBtn:hover:not(:disabled) {
            opacity: 0.88;
        }

        #status {
            font-size: 12px;
            min-height: 16px;
            text-align: center;
        }

        #status.success { color: #2d8c56; }
        #status.error   { color: #e74c3c; }

        /* ── Footer ── */
        #sessionBar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 14px;
            border-top: 1px solid #ededed;
            font-size: 11px;
            color: #b0bcca;
        }

        #sessionEmail {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 180px;
        }

        #logoutBtn {
            width: auto;
            padding: 4px 10px;
            background: #f0f2f5;
            color: #5c6b78;
            font-size: 11px;
            font-weight: 500;
            border-radius: 6px;
        }

        #logoutBtn:hover {
            background: #e4e7ed;
        }
    </style>
</head>
<body>

<!-- ── Login view ── -->
<div id="loginView">
    <div class="logo">
        <div class="logo-icon-wrap">
            <img alt="JAM" src="icons/icon128.png"/>
        </div>
        <div class="logo-name">JAM</div>
        <div class="logo-sub">Job Application Manager</div>
    </div>

    <div class="field">
        <label for="emailInput">Email</label>
        <input autocomplete="email" id="emailInput" placeholder="you@example.com" type="email"/>
    </div>
    <div class="field">
        <label for="passwordInput">Password</label>
        <input autocomplete="current-password" id="passwordInput" type="password"/>
    </div>

    <button id="loginBtn">
        <span id="loginBtnLabel">Log in</span>
        <span class="spinner hidden" id="loginSpinner"></span>
    </button>
    <div id="loginStatus"></div>
</div>

<!-- ── Main (logged-in) view ── -->
<div id="mainView" style="display:none">
    <div class="main-header">
        <div class="header-icon-wrap">
            <img alt="JAM" src="icons/icon128.png"/>
        </div>
        <span class="main-logo-name">JAM</span>
        <span class="main-header-sub">Job Application Manager</span>
    </div>

    <div class="job-area">
        <!-- Detecting state (default) -->
        <div class="detecting-row" id="detectingRow">
            <div class="detecting-dot"></div>
            <span>Detecting job…</span>
        </div>

        <!-- No job detected -->
        <div class="no-job-msg hidden" id="noJobMsg">
            <div class="no-job-icon">🔍</div>
            <div class="no-job-text">Navigate to a LinkedIn or Indeed job listing<br/>to save it to JAM.</div>
        </div>

        <!-- Job detected card -->
        <div class="job-card hidden" id="jobCard">
            <div class="platform-badge" id="platformBadge">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="white">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </div>
            <div class="job-title" id="jobTitle">—</div>
            <div class="job-company" id="jobCompany"></div>
        </div>
    </div>

    <div class="action-area">
        <button class="hidden" id="addBtn">
            <span id="addBtnLabel">Save to JAM</span>
            <span class="spinner hidden" id="addSpinner"></span>
        </button>
        <div id="status"></div>
    </div>

    <div id="sessionBar">
        <span id="sessionEmail"></span>
        <button id="logoutBtn">Log out</button>
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
